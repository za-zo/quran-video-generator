# Quran Video Generator – scheduled + manual clip generation.
#
# Runs the Python pipeline on an ephemeral GitHub Actions runner:
#   1. Downloads the source media files listed in MongoDB (audios + videos)
#      into a runner-local temp directory.
#   2. Builds the final MP4 via FFmpeg (re-encode pipeline, closed GOP).
#   3. Uploads the MP4 to Cloudinary.
#   4. Writes the Cloudinary URL + metadata back to MongoDB (executions doc).
#   5. The temp directory is discarded automatically when the job ends.
#
# Required repository secrets
# ---------------------------
# MONGODB_URI              – MongoDB Atlas connection string
# MONGODB_DB_NAME          – database name (default: quran_video_generator)
# CLOUDINARY_CLOUD_NAME    – Cloudinary cloud name
# CLOUDINARY_API_KEY       – Cloudinary API key
# CLOUDINARY_API_SECRET    – Cloudinary API secret
#
# Tuning the schedule
# -------------------
# Edit the `cron:` line below. Current default: 04:00 UTC daily (matches
# a low-traffic window for most regions). The schedule is independent of
# the manual trigger; both can fire in the same day.
#
# Batch resilience
# ----------------
# A run with at least one successful clip exits 0 (the Actions run shows
# green). Only when literally nothing succeeded does the step exit non-zero
# so the Actions run shows red. Failed individual clips are still recorded
# as `failed` executions in MongoDB for later inspection via the webapp.

name: generate-videos

on:
  workflow_dispatch:
    inputs:
      audio_count:
        description: "Number of distinct audios to process in this run"
        required: false
        default: "1"
        type: string
      clips_per_audio:
        description: "Override clips_per_audio (config.yaml default applies if blank)"
        required: false
        default: ""
        type: string
      clip_duration:
        description: "Override clip_duration in seconds (config.yaml default applies if blank)"
        required: false
        default: ""
        type: string
      smoke_test:
        description: "Smoke test: 1 audio, 1 clip, 15s duration (overrides the three above)"
        required: false
        default: false
        type: boolean

  schedule:
    # 04:00 UTC daily — change to suit your traffic patterns.
    - cron: "0 4 * * *"

permissions:
  contents: read

jobs:
  generate:
    name: Generate Quran videos
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      MONGODB_DB_NAME: ${{ secrets.MONGODB_DB_NAME || 'quran_video_generator' }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      GITHUB_RUN_ID: ${{ github.run_id }}
      QVG_CONFIG_FILE: config.example.yaml
      LOG_LEVEL: INFO

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve run parameters
        id: params
        run: |
          if [ "${{ github.event.inputs.smoke_test }}" = "true" ]; then
            echo "audio_count=1" >> $GITHUB_OUTPUT
            echo "clips_per_audio=1" >> $GITHUB_OUTPUT
            echo "clip_duration=15" >> $GITHUB_OUTPUT
          else
            # Schedule path: github.event.inputs.* is empty, fall back to defaults.
            AC="${{ github.event.inputs.audio_count || '1' }}"
            CPA="${{ github.event.inputs.clips_per_audio }}"
            CD="${{ github.event.inputs.clip_duration }}"
            echo "audio_count=$AC" >> $GITHUB_OUTPUT
            echo "clips_per_audio=$CPA" >> $GITHUB_OUTPUT
            echo "clip_duration=$CD" >> $GITHUB_OUTPUT
          fi

      - name: Verify configuration
        run: |
          python -c "
          import os
          # Print which secret-derived env vars are present (NOT their values).
          for k in ['MONGODB_URI', 'MONGODB_DB_NAME', 'CLOUDINARY_CLOUD_NAME',
                    'CLOUDINARY_API_KEY', 'CLOUDINARY_API_SECRET']:
              print(f'  {k}: {\"set (\" + str(len(os.environ.get(k, \"\"))) + \" chars)\" if os.environ.get(k) else \"MISSING\"}')
          from src.config.settings import get_settings
          s = get_settings()
          s.require_cloud_credentials()
          print('config OK; db_name=', s.mongodb_db_name)
          "

      - name: init-db (ensure MongoDB indexes + ping)
        run: python main.py init-db

      - name: generate
        run: |
          python main.py generate \
            --audio-count "${{ steps.params.outputs.audio_count }}" \
            ${{ steps.params.outputs.clips_per_audio && format('--clips-per-audio {0}', steps.params.outputs.clips_per_audio) || '' }} \
            ${{ steps.params.outputs.clip_duration && format('--clip-duration {0}', steps.params.outputs.clip_duration) || '' }}

      - name: Print stats
        if: always()
        run: python main.py stats || true
