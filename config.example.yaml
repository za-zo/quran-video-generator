# === Quran Video Generator – example configuration ===
# Copy to config.yaml and adjust. Values can also be overridden by environment
# variables (see .env.example). Environment variables take precedence over
# the values in this file.
#
# IMPORTANT: leave the secret fields COMMENTED OUT (or set them to a
# non-empty placeholder). Pydantic v2 BaseSettings gives explicit YAML
# values precedence over env vars, so an empty string `mongodb_uri: ""`
# here would silently override the real value coming from MONGODB_URI in
# the environment. The loader filters out empty/None scalars as a safety
# net, but commenting them out is the clearest signal to anyone reading
# this file.

# --- Cloud infrastructure (REQUIRED) ---
# MongoDB Atlas: set MONGODB_URI via env var / GitHub secret.
# mongodb_uri: ""              # ← DO NOT uncomment with empty value
mongodb_db_name: "quran_video_generator"

# Cloudinary: set CLOUDINARY_CLOUD_NAME / CLOUDINARY_API_KEY /
# CLOUDINARY_API_SECRET via env vars / GitHub secrets.
# cloudinary_cloud_name: ""   # ← DO NOT uncomment with empty value
# cloudinary_api_key: ""      # ← DO NOT uncomment with empty value
# cloudinary_api_secret: ""   # ← DO NOT uncomment with empty value

# GitHub Actions run ID (auto-filled by the workflow; empty when local).
# github_run_id: ""

# --- Clip generation ---
clip_duration: 60              # seconds – length of each generated clip
clips_per_audio: 5             # max number of non-overlapping clips per audio

# --- Output video technical params ---
resolution: "1080x1920"        # WIDTHxHEIGHT – vertical format for Shorts/Reels/TikTok
fps: 30
video_codec: "libx264"
audio_codec: "aac"

# --- Paths (local-only; GitHub Actions runner ephemeral storage) ---
output_dir: "./output"
temp_dir: "./temp"

# --- Selection behaviour ---
category_cooldown: 3           # exclude categories used in the last K generated clips
allow_video_reuse_within_job: true   # if a category runs out of videos, allow reuse
log_level: "INFO"              # DEBUG | INFO | WARNING | ERROR

# Selection algorithm tuning
selection:
  recency_decay_minutes: 1440   # how fast recency penalty decays (24h)
  usage_weight: 1.0             # weight applied to inverse usage_count score
  recency_weight: 1.0           # weight applied to recency score
  strict_least_used: true       # always pick least-used candidates before higher-usage ones

# Silence detection for ayat-respecting cuts.
# Run once per audio via `python main.py analyze-audio --all` or
# automatically during `generate`. The result is cached on the audio
# document so subsequent runs reuse it.
silence_detection:
  min_silence_len_ms: 300
  threshold_percentile: 15
  max_positions: 500
  tolerance_seconds: 5.0

# Logging
logging:
  log_dir: "./logs"
  log_file: "app.log"
  max_log_size_mb: 5
  backup_count: 5
